<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sarthi Shop</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#fffefc}.top{padding:14px 16px;background:#111;color:#fff;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.card{border:1px solid #eee;border-radius:16px;overflow:hidden;background:#fff}.card img{width:100%;height:150px;object-fit:cover}.info{padding:10px}.btn{width:100%;padding:8px;background:#111;color:#fff;border:none;border-radius:8px;margin-top:6px}</style></head><body>
<div class="top"><b>🛍️ Sarthi Shop</b><span style="background:#ffb26b;color:#000;padding:4px 10px;border-radius:12px;font-size:12px">LIVE</span></div>
<div style="padding:12px 16px"><b>Vendor Products - Real Time</b><br><small style="color:#666">Vendor jo itom wise photo lagayega yahi najar ayega</small></div>
<div class="grid" id="grid">Loading products...</div>
<script>
const supa = supabase.createClient("https://nmjrsalsaehopxtyafef.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tanJzYWxzYWVhb3B4dHlhZmVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzE3MjEsImV4cCI6MjEwNjk0NzcyMX0.oRbBm1Vew7DgM88hSDmhL9aie0m_ORkxPmChUXyckEQ");
async function load(){
 let {data,error} = await supa.from('products').select('*').order('id',{ascending:false});
 if(error){document.getElementById('grid').innerText='Error: '+error.message; return}
 if(!data||data.length==0){document.getElementById('grid').innerHTML='<p style="grid-column:1/3;text-align:center;padding:30px;color:#888">No products yet<br>Vendor app se add karo</p>';return}
 document.getElementById('grid').innerHTML = data.map(p=>`<div class="card"><img src="${p.image}"><div class="info"><b style="font-size:13px">${p.name}</b><br><small style="color:#888">${p.vendor||'Vendor'}</small><br><b>₹${p.price}</b><button class="btn">Add to Cart</button></div></div>`).join('');
}
load();
setInterval(load,3000);
</script>
</body></html>
