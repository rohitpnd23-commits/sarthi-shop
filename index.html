<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarthi Shop - Pro with Orders</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head>
<body class="bg-[#eaeded]">
<div class="max-w-[430px] mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative">
<div class="bg-[#131921] text-white p-3 flex items-center gap-2 sticky top-0 z-50">
<div class="font-black text-[16px]"><span class="text-[#febd69]">Sarthi</span> Shop</div>
<div class="flex-1 bg-white rounded flex overflow-hidden ml-2"><input id="searchInput" oninput="render()" placeholder="Search" class="flex-1 text-black px-2 py-2 text-xs outline-none"><button class="bg-[#febd69] px-2">🔍</button></div>
<div onclick="openCart()" class="relative ml-1">🛒<span id="cartCount" class="absolute -top-1 -right-1 bg-orange-400 text-black text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span></div>
<div onclick="openAuth()" id="loginBtn" class="ml-1 text-[9px] bg-white text-black px-2 py-1 rounded font-black">Login</div>
</div>
<div id="userBar" class="bg-[#232f3e] text-white px-3 py-1.5 text-[10px] flex justify-between hidden"><span id="userInfo"></span><span class="flex gap-2"><span onclick="openOrders()" class="underline">My Orders</span><span onclick="logout()" class="underline">Logout</span></span></div>
<div class="flex gap-2 overflow-x-auto p-2 bg-white text-[11px] font-bold"><button onclick="filterCat('All')" class="bg-black text-white px-3 py-1 rounded-full">All</button><button onclick="filterCat('Fashion')" class="border px-3 py-1 rounded-full">Fashion</button><button onclick="filterCat('Mobiles')" class="border px-3 py-1 rounded-full">Mobiles</button><button onclick="filterCat('Electronics')" class="border px-3 py-1 rounded-full">Electronics</button></div>
<div id="productGrid" class="grid grid-cols-2 gap-2 p-2 bg-[#eaeded] flex-1 overflow-y-auto"></div>
<div id="authModal" class="hidden absolute inset-0 bg-black/70 z-[60] flex items-center justify-center p-4"><div class="bg-white rounded-[16px] w-full p-5"><div class="flex justify-between"><h2 id="authTitle" class="font-black text-xl">Login</h2><button onclick="closeAuth()">✕</button></div><div class="mt-4 space-y-3"><input id="authName" placeholder="Full Name" class="w-full border rounded-lg px-3 py-3 text-sm hidden"><input id="authEmail" placeholder="Email" class="w-full border rounded-lg px-3 py-3 text-sm"><input id="authPass" type="password" placeholder="Password" class="w-full border rounded-lg px-3 py-3 text-sm"><button onclick="handleAuth()" id="authBtn" class="w-full bg-[#ffd814] py-3 rounded-lg font-black border">Login</button><p class="text-xs text-center"><span id="authSwitchText">New user?</span> <span onclick="toggleAuth()" class="text-blue-600 font-bold" id="authSwitchBtn">Create Account</span></p><p id="authError" class="text-red-600 text-xs hidden"></p></div></div></div>
<div id="cartSheet" class="hidden absolute inset-0 bg-black/60 z-50 flex flex-col justify-end"><div class="bg-white rounded-t-[20px] max-h-[90vh] flex flex-col"><div class="p-4 flex justify-between border-b"><h2 class="font-black">Cart</h2><button onclick="closeCart()">✕</button></div><div id="cartItems" class="flex-1 overflow-y-auto p-3 space-y-2"></div><div class="p-4 border-t"><div class="flex gap-2"><label class="flex-1 border-2 border-green-600 bg-green-50 rounded p-2 text-xs font-bold"><input type="radio" name="pay" value="COD" checked> COD</label><label class="flex-1 border rounded p-2 text-xs font-bold"><input type="radio" name="pay" value="UPI"> UPI</label></div><div class="flex justify-between font-black mt-3"><span>Total</span><span id="cartTotal">₹0</span></div><button onclick="placeOrder()" class="w-full bg-[#ffd814] py-3 rounded-lg font-black mt-3">Place Order</button></div></div></div>
<div id="ordersPage" class="hidden absolute inset-0 bg-[#eaeded] z-[55] flex flex-col"><div class="bg-[#131921] text-white p-3 flex justify-between"><h2 class="font-black">My Orders</h2><button onclick="closeOrders()" class="bg-white text-black px-2 rounded text-xs">✕ Close</button></div><div id="ordersList" class="flex-1 overflow-y-auto p-3 space-y-3"></div></div>
<div id="success" class="hidden absolute inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center"><div class="text-6xl">✅</div><h1 class="font-black text-2xl mt-3">Order Placed!</h1><p id="orderInfo" class="text-sm mt-2 whitespace-pre-line"></p><button onclick="openOrdersFromSuccess()" class="w-full bg-black text-white py-3 rounded-full font-black mt-6">View My Orders</button><button onclick="location.reload()" class="w-full bg-[#ffd814] py-3 rounded-full font-black mt-2">Continue Shopping</button></div>
</div>
<script>
//... same JS as previous (products, cart, auth, orders)...
const supa=supabase.createClient("https://nmjrsalsaeaoptyafef.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tanJzYWxzYWVhb3B0eXlhZmVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzE3MjEsImV4cCI6MjEwNjk0NzcyMX0.oRbBm1Vew7DgM88hSDmhL9aie0m_ORkxPmChUXyckEQ");
const products=[{id:1,name:"Men T-Shirt Combo",price:499,mrp:1299,cat:"Fashion",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",rating:4.3},{id:2,name:"Wireless Earbuds",price:1199,mrp:2999,cat:"Electronics",img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400",rating:4.5},{id:3,name:"Phone Cover",price:199,mrp:599,cat:"Mobiles",img:"https://images.unsplash.com/photo-1556656793-08538906a9f8?w=400",rating:4.2},{id:4,name:"Kitchen Box",price:599,mrp:1499,cat:"Home",img:"https://images.unsplash.com/photo-1584305574586-0a916646b47a?w=400",rating:4.1},{id:5,name:"Running Shoes",price:1899,mrp:3999,cat:"Fashion",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",rating:4.6},{id:6,name:"Smart Watch",price:2499,mrp:5999,cat:"Electronics",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400",rating:4.4}];
let cart=JSON.parse(localStorage.getItem('sarthiCart')||'[]');let cat='All';let isLogin=true;let currentUser=JSON.parse(localStorage.getItem('sarthiUser')||'null');let myOrders=JSON.parse(localStorage.getItem('sarthiOrders')||'[]');
function updateUserBar(){let bar=document.getElementById('userBar');let btn=document.getElementById('loginBtn');if(currentUser){bar.classList.remove('hidden');document.getElementById('userInfo').innerText=`Hello, ${currentUser.name}`;btn.innerText='Logout';btn.onclick=logout;}else{bar.classList.add('hidden');btn.innerText='Login';btn.onclick=openAuth;}}
function render(){let q=document.getElementById('searchInput').value.toLowerCase();let f=products.filter(p=>(cat==='All'||p.cat===cat)&&p.name.toLowerCase().includes(q));document.getElementById('productGrid').innerHTML=f.map(p=>`<div class="bg-white rounded-lg p-2"><img src="${p.img}" class="w-full h-24 object-contain bg-gray-50"><p class="text-xs mt-1 h-8">${p.name}</p><p class="text-[10px] text-green-700">⭐ ${p.rating}</p><div class="flex gap-1"><span class="font-black text-sm">₹${p.price}</span><span class="text-xs line-through text-gray-400">₹${p.mrp}</span></div><button onclick="addCart(${p.id})" class="w-full bg-[#ffd814] rounded-full py-1.5 text-xs font-bold mt-2 border">Add to Cart</button></div>`).join('');document.getElementById('cartCount').innerText=cart.reduce((s,c)=>s+c.qty,0);updateUserBar();}
function addCart(id){let e=cart.find(c=>c.id===id);if(e)e.qty++;else{let p=products.find(x=>x.id===id);cart.push({...p,qty:1});}localStorage.setItem('sarthiCart',JSON.stringify(cart));render();openCart();}
function openCart(){if(!currentUser){openAuth();return;}document.getElementById('cartSheet').classList.remove('hidden');let div=document.getElementById('cartItems');if(cart.length==0){div.innerHTML='<p class="text-center py-10">Empty</p>';return;}div.innerHTML=cart.map(c=>`<div class="flex gap-2 bg-gray-50 p-2 rounded"><img src="${c.img}" class="w-14 h-14 bg-white"><div class="flex-1"><p class="text-xs font-bold">${c.name}</p><p class="text-xs">Qty:${c.qty}</p><button onclick="chg(${c.id},-1)" class="border px-2">-</button><button onclick="chg(${c.id},1)" class="border px-2 ml-1">+</button></div><p class="font-bold">₹${c.price*c.qty}</p></div>`).join('');document.getElementById('cartTotal').innerText='₹'+cart.reduce((s,c)=>s+c.price*c.qty,0);}
function closeCart(){document.getElementById('cartSheet').classList.add('hidden');}
function chg(id,d){let it=cart.find(c=>c.id===id);it.qty+=d;if(it.qty<=0)cart=cart.filter(c=>c.id!==id);localStorage.setItem('sarthiCart',JSON.stringify(cart));render();openCart();}
function filterCat(c){cat=c;render();}
function openAuth(){document.getElementById('authModal').classList.remove('hidden');}
function closeAuth(){document.getElementById('authModal').classList.add('hidden');}
function toggleAuth(){isLogin=!isLogin;document.getElementById('authTitle').innerText=isLogin?'Login':'Signup';document.getElementById('authBtn').innerText=isLogin?'Login':'Create Account';document.getElementById('authName').classList.toggle('hidden',isLogin);document.getElementById('authSwitchText').innerText=isLogin?'New user?':'Already?';document.getElementById('authSwitchBtn').innerText=isLogin?'Create Account':'Login';}
function handleAuth(){let email=document.getElementById('authEmail').value.trim();let pass=document.getElementById('authPass').value.trim();let name=document.getElementById('authName').value.trim();if(!email||!pass||(!isLogin&&!name)){document.getElementById('authError').innerText='Fill all';document.getElementById('authError').classList.remove('hidden');return;}if(isLogin){let users=JSON.parse(localStorage.getItem('sarthiUsers')||'[]');let u=users.find(x=>x.email===email&&x.pass===pass);if(!u){document.getElementById('authError').innerText='Invalid';document.getElementById('authError').classList.remove('hidden');return;}currentUser=u;localStorage.setItem('sarthiUser',JSON.stringify(u));}else{let users=JSON.parse(localStorage.getItem('sarthiUsers')||'[]');if(users.find(x=>x.email===email)){document.getElementById('authError').innerText='Exists';document.getElementById('authError').classList.remove('hidden');return;}let nu={name,email,pass};users.push(nu);localStorage.setItem('sarthiUsers',JSON.stringify(users));currentUser=nu;localStorage.setItem('sarthiUser',JSON.stringify(nu));}closeAuth();render();}
function logout(){localStorage.removeItem('sarthiUser');currentUser=null;render();}
async function placeOrder(){if(!currentUser){openAuth();return;}if(cart.length==0)return;let pay=document.querySelector('input[name="pay"]:checked').value;let oid='SAR'+Math.floor(100000+Math.random()*900000);let tot=cart.reduce((s,c)=>s+c.price*c.qty,0);let orderObj={id:oid,items:[...cart],total:tot,pay:pay,date:new Date().toLocaleString(),email:currentUser.email};myOrders.unshift(orderObj);localStorage.setItem('sarthiOrders',JSON.stringify(myOrders));try{await supa.from('sarthi_bookings').insert([{id:oid,customer_email:currentUser.email,from_address:'Shop Order '+currentUser.name,to_address:'COD '+pay,dist:cart.length+' items',fare:tot,status:'ordered_cod',vehicle_type:'shopping',from_lat:22.57,from_lng:88.36,to_lat:22.57,to_lng:88.36}]);}catch(e){}document.getElementById('orderInfo').innerText=`Order: ${oid}\nTotal: ₹${tot} - ${pay}\nUser: ${currentUser.email}`;document.getElementById('success').classList.remove('hidden');cart=[];localStorage.setItem('sarthiCart','[]');}
function openOrders(){if(!currentUser){openAuth();return;}document.getElementById('ordersPage').classList.remove('hidden');let list=document.getElementById('ordersList');let userOrders=myOrders.filter(o=>o.email===currentUser.email);if(userOrders.length==0){list.innerHTML='<p class="text-center mt-20 text-gray-500">No orders yet</p>';return;}list.innerHTML=userOrders.map(o=>`<div class="bg-white rounded-lg p-3 shadow"><div class="flex justify-between"><span class="font-black text-xs">${o.id}</span><span class="text-[10px] bg-green-100 text-green-700 px-2 rounded">COD - ${o.pay}</span></div><p class="text-[11px] text-gray-500 mt-1">${o.date}</p><div class="mt-2 space-y-1">${o.items.map(i=>`<div class="flex gap-2 text-xs"><img src="${i.img}" class="w-10 h-10"><div><p class="font-bold">${i.name}</p><p>Qty: ${i.qty} x ₹${i.price}</p></div></div>`).join('')}</div><div class="flex justify-between font-black mt-2 border-t pt-2 text-sm"><span>Total</span><span>₹${o.total}</span></div></div>`).join('');}
function closeOrders(){document.getElementById('ordersPage').classList.add('hidden');}
function openOrdersFromSuccess(){document.getElementById('success').classList.add('hidden');openOrders();}
render();
</script></body></html>
