<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sarthi Shop</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f5f5}.top{background:#111;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}.badge{background:#ffb26b;color:#111;padding:6px 14px;border-radius:20px;font-weight:700}.card{background:#fff;margin:12px;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}.card img{width:100%;height:180px;object-fit:cover}.info{padding:10px}.price{color:#e65100;font-weight:700}</style></head><body>
<div class="top"><div>🛍️ Sarthi Shop</div><div class="badge">LIVE</div></div>
<h3 style="padding:16px 16px 0">Vendor Products - Real Time</h3>
<p style="padding:0 16px;color:#666;font-size:13px">Vendor jo item wise photo lagayega yahi najar ayega</p>
<div id="list" style="padding:8px"><p style="padding:16px">Loading products...</p></div>
<script>
const URL="https://nmjrsalsaehopxtyafef.supabase.co/rest/v1/products?select=*&order=id.desc";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tanJzYWxzYWVhb3B4dHlhZmVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzE3MjEsImV4cCI6MjEwNjk0NzcyMX0.oRbBm1Vew7DgM88hSDmhL9aie0m_ORkxPmChUXyckEQ";
async function load(){
 try{
  let res = await fetch(URL,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  if(!res.ok) throw new Error('direct fail');
  let data = await res.json();
  show(data);
 }catch(e){
  // Proxy try
  try{
   let proxy = "https://corsproxy.io/?"+encodeURIComponent(URL);
   let res = await fetch(proxy,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
   let data = await res.json();
   show(data);
  }catch(err){
   document.getElementById('list').innerHTML='<p style="padding:16px;color:red">Network block hai, 1.1.1.1 WARP ON karo fir refresh karo</p>';
  }
 }
}
function show(data){
 if(!data||data.length==0){document.getElementById('list').innerHTML='<p style="padding:16px">Koi product nahi hai abhi</p>';return;}
 document.getElementById('list').innerHTML=data.map(p=>`<div class="card"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'"><div class="info"><b>${p.name}</b><div class="price">₹${p.price} • Stock ${p.stock}</div><div style="font-size:12px;color:#666">${p.vendor||''}</div></div></div>`).join('');
}
load();
</script></body></html>
